apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: low-priority}
value: 100
globalDefault: false
description: "Фоновая нагрузка, вытесняется первой"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: infra}
value: 1000
globalDefault: false
description: "Хранилище: выше фоновой нагрузки, ниже срочных заданий"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: high-priority}
value: 100000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: "Срочное задание, может вытеснять поды с меньшим приоритетом"