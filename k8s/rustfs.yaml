apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: hh
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: hh
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: rustfs}
  template:
    metadata:
      labels: {app: rustfs}
    spec:
      priorityClassName: infra
      securityContext:
        runAsUser: 0
      containers:
      - name: rustfs
        image: rustfs/rustfs:latest
        ports:
        - {containerPort: 9000, name: s3}
        - {containerPort: 9001, name: console}
        env:
        - name: RUSTFS_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: s3-secret, key: S3_ACCESS_KEY}}
        - name: RUSTFS_SECRET_KEY
          valueFrom: {secretKeyRef: {name: s3-secret, key: S3_SECRET_KEY}}
        volumeMounts:
        - {name: data, mountPath: /data}
        readinessProbe:
          tcpSocket: {port: 9000}
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests: {cpu: 250m, memory: 256Mi}
          limits: {memory: 1Gi}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: rustfs-data}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: hh
spec:
  selector: {app: rustfs}
  ports:
  - {name: s3, port: 9000, targetPort: 9000}
  - {name: console, port: 9001, targetPort: 9001}