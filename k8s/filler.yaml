apiVersion: apps/v1
kind: Deployment
metadata:
  name: filler-low
  namespace: ${NAMESPACE}
spec:
  replicas: ${FILL_REPLICAS}
  selector:
    matchLabels: {app: filler-low}
  template:
    metadata:
      labels: {app: filler-low}
    spec:
      priorityClassName: low-priority
      containers:
      - name: sleeper
        image: busybox:1.36
        command: ["sleep", "3600"]
        resources:
          requests: {cpu: ${FILL_CPU}, memory: 16Mi}
          limits: {memory: 32Mi}